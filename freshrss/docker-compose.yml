services:
  freshrss:
    image: lscr.io/linuxserver/freshrss:latest
    container_name: freshrss
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    ports:
      - "8081:80/tcp"
    volumes:
      - ./data/config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/i/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
