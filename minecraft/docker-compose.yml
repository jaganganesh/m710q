services:
  survival:
    image: itzg/minecraft-bedrock-server:latest
    container_name: minecraft-survival
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - EULA=true
      - GAMEMODE=survival
      - DIFFICULTY=easy
      - LEVEL_NAME=Little Paradise
      - LEVEL_SEED=${SURVIVAL_SEED}
      - ONLINE_MODE=false
      - ALLOW_LIST=false
      - ENABLE_LAN_VISIBILITY=true
      - SERVER_PORT=19132
      - DEFAULT_PLAYER_PERMISSION_LEVEL=operator
      # Performance Tweaks
      - VIEW_DISTANCE=12
      - TICK_DISTANCE=4
      - MAX_THREADS=4
    ports:
      - "19132:19132/udp"
      - "19133:19133/udp"
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          memory: 3072M
    healthcheck:
      test: ["CMD-SHELL", "test -d /proc/1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
